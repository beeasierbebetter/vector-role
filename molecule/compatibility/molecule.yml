---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: vector-compatibility
    image: docker.io/library/oraclelinux:8
    pre_build_image: true
    command: sleep infinity
    systemd: false

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_python_interpreter: /usr/libexec/platform-python
        ansible_become: false

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
