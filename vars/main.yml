---
_vector_package_names:
  Debian: "vector_{{ vector_version }}-1_amd64.deb"
  RedHat: "vector-{{ vector_version }}-1.x86_64.rpm"

_vector_package_name: "{{ _vector_package_names[ansible_os_family] }}"
_vector_download_url: >-
  https://github.com/vectordotdev/vector/releases/download/v{{
  vector_version }}/{{ _vector_package_name }}
_vector_package_path: "/var/cache/{{ _vector_package_name }}"
_vector_config_path: /etc/vector/vector.yaml
_vector_data_dir: /var/lib/vector
_vector_service_name: vector
